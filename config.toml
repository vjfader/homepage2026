    weight = 3
    name = "Stage Design"
    url = "/stage-design/"
  [[menu.header]]
    weight = 4
    name = "About"
    url = "/#about"
  [[menu.header]]
    weight = 5
    name = "Contact"
    url = "/#contact"

  [[menu.footer]]
    weight = 1
    name = "Home"
    url = "/"
  [[menu.footer]]
    weight = 2
    name = "VFX Music Visualization"
    url = "/vfx/"
  [[menu.footer]]
    weight = 3
    name = "Stage Design"
    url = "/stage-design/"
  [[menu.footer]]
    weight = 4
