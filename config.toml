title = "Fader"
baseURL = "https://vjfader.com/"
languageCode = "en-us"
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
canonifyURLs = false
laxHtmlBlocks = true
enableGitInfo = true
# Tag and category pages are thin and not linked anywhere; keep them out of the build and sitemap.
disableKinds = ["taxonomy", "term"]

[frontmatter]
  lastmod = [":git", "lastmod", ":fileModTime", ":default"]

[sitemap]
  changefreq = "monthly"

description = "VJ Fader (James Cui) is a Berlin-based motion designer, stage designer and VFX artist making audio-reactive visuals, AI video and stage design."

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[privacy]
  [privacy.youtube]
    privacyEnhanced = true

[menu]

  [[menu.header]]
    weight = 1
    name = "Work"
    url = "/#work"
  [[menu.header]]
    weight = 2
