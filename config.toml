    url = "/#contact"

# The site's parameters
[params]
  author = "James Cui"
  location = "Berlin, Germany"
  keywords = ["motion designer", "AI video", "generative AI video", "VFX artist", "music visualization", "audio reactive visuals", "Unreal Engine Niagara", "projection mapping", "stage design", "live visuals", "Berlin"]

  [params.seo]
    title = "Fader"
    titleSuffix = "Motion Design, AI Video, VFX and Stage Design"
    description = "VJ Fader (James Cui): Berlin motion designer, stage designer and VFX artist. Audio-reactive visuals, AI video and stage design. Winner of the 2026 Janus Award."
    image = "/img/Fader_profile02_700.jpg"
    type = "website"

  # Analytics: fill in ONE of these. Leave both empty to disable analytics.
  # plausibleDomain: cookie-free, no consent banner needed (e.g. "vjfader.com").
  # ga4: Google Analytics 4 ID (e.g. "G-XXXXXXXXXX"); loads only after the visitor accepts the cookie banner.
  [params.analytics]
    plausibleDomain = ""
    ga4 = ""

  [params.social]
    youtube = "https://www.youtube.com/user/vjfader"
    instagram = "https://www.instagram.com/vjfader"
    linkedin = "https://www.linkedin.com/in/james-cui-6466051/"
    facebook = "https://www.facebook.com/vjfader/"
    vimeo = "https://vimeo.com/vjfader"

  # If you want to remove the copyright text you need a Themefisher license.
  # This license is offered with a 50% discount for all Hugo users.
  # For information see https://github.com/gohugoio/hugoThemes/issues/260

  dateFormat = "6 January 2016"

  # home = "Fader Home"

  [params.slider]
    enable = true
    title = "Visuals that move with sound"
    subtitle = "Audio-reactive visuals, VFX, and stage design for live experiences."
    eyebrow = "VJ Fader · James Cui · Berlin"

  [params.vfx]
    title = "VFX Music Visualization"
    summary = "I create realtime visuals for music, immersive platforms, and digital experiences, combining particle systems, environment animation, motion design, and interactive visual storytelling across Unreal Engine, Unity, and After Effects."
    points = ["Audio-reactive visual systems for live music and immersive experiences", "Realtime VFX and particle-driven motion built with Unreal Engine Niagara", "VR and platform-focused visuals shaped for collaboration and delivery"]
    reel = "RTKDf4DGSlY"

  [params.wrapper]
    enable = true
    title = "Meet Fader"
    italic = "I'm James Cui, aka VJ Fader, a Berlin-based motion designer and VFX artist. For 15+ years I've made visuals for music — festival stages, real-time particle systems, and now AI video."
    paragraph = "I started with video mapping in 2010 and spent eight years designing stages for INTRO Festival. Since 2021 I've built audio-reactive VFX in Unreal Niagara for VR DJ experiences at TLM Partners and Sensorium. Today I take those real-time animations further with Runway and ComfyUI. I also teach Unity and video mapping workshops, from Berlin to Cape Town."

  # Awards. The first one with hero = true is shown under the homepage headline.
  [[params.awards]]
    name = "Janus Award – Best Sonic Experience"
    org = "Fulldome Festival Jena"
    year = 2026
    hero = true
  [[params.awards]]
    name = "App Art Award"
    org = "ZKM Karlsruhe"
    year = 2015

  [params.feature]
    reel = "TsxW3gy_A8M"
    enable = true
    title = "Stage Design for Immersive Live Experiences"
    content = "I treat a stage like a sculpture shaped by the event and its audience. Indoors or outdoors, modern or classic, LED screens, projectors, lasers and light are the materials I build with. Every design starts with a strong concept that gives the show its identity."

  [params.workfeature]
    enable = true
  [params.workfeature.button]
      caption = "View my Stage Design Portfolio PDF"
      url = "/download/VJFader-StageDesign-Portfolio-2018v1.pdf"

  [params.contact]
    enable = true
    title = "Get in Touch"
    subtitle = "If you have an upcoming project or questions about my past work, feel free to write."
    [params.contact.form]
      name = "Name"
      email = "Email"
      subject = "Subject"
      message = "Message"
      button = "Send message"
    [params.contact.box]
      title = "Contact"
      address = "Berlin, Germany"
      email = "vjfader@gmail.com"
    [params.contact.gmaps]
      title = "Where in the World?"
