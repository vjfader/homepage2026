# Netlify build settings (these override the settings in the Netlify UI).

[build]
  command = "hugo --gc --minify"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.152.2"
  HUGO_EXTENDED = "true"
  HUGO_ENV = "production"

# Branch and pull-request previews use their own preview URL
[context.deploy-preview]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

# Long browser caching for files whose names change when their content changes
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Old tag and category pages were removed; send visitors and crawlers to the blog.
[[redirects]]
  from = "/tags/*"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/categories/*"
  to = "/blog/"
  status = 301
