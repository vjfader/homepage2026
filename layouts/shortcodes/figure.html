{{- /* Image with optional caption; opens in the site lightbox. Params: src, title|caption, alt, link */ -}}
{{- $src := .Get "src" -}}
{{- $caption := .Get "caption" | default (.Get "title") -}}
{{- $alt := .Get "alt" | default $caption -}}
{{- $href := .Get "link" | default $src -}}
<figure class="figure">
  <a href="{{ $href | absURL }}" data-lightbox data-caption="{{ $caption }}">
    <img src="{{ $src | absURL }}" alt="{{ $alt }}" loading="lazy" decoding="async">
  </a>
  {{- with $caption }}<figcaption>{{ . }}</figcaption>{{ end }}
</figure>
