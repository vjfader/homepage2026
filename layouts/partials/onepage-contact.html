{{ with .Site.Params.contact }}
<section id="contact" class="onepage-dark-section">
  <div class="container">
    <div class="row">
      <div class="section-title text-center onepage-light-text">
        <h2 class="onepage-light-heading">{{ .title }}</h2>
        <p class="onepage-light-text onepage-copy">{{ .subtitle }}</p>
      </div>
    </div>

    <div class="row">
      <div class="col-md-6 col-sm-12">
        <div class="block">
          <form name="contact" method="POST" action="/thanks/" data-netlify="true" netlify-honeypot="bot-field" data-netlify-recaptcha="true">
            <input type="hidden" name="form-name" value="contact">
            <p class="sr-only" hidden><label>Leave this empty: <input name="bot-field"></label></p>
            <div class="form-group">
              <label for="contact-name" class="sr-only">{{ .form.name }}</label>
              <input type="text" id="contact-name" name="name" class="form-control" placeholder="{{ .form.name }}" autocomplete="name" required>
            </div>
            <div class="form-group">
              <label for="contact-email" class="sr-only">{{ .form.email }}</label>
              <input type="email" id="contact-email" name="email" class="form-control" placeholder="{{ .form.email }}" autocomplete="email" required>
            </div>
            <div class="form-group">
              <label for="contact-subject" class="sr-only">{{ .form.subject }}</label>
              <input type="text" id="contact-subject" name="subject" class="form-control" placeholder="{{ .form.subject }}">
            </div>
            <div class="form-group-2">
              <label for="contact-message" class="sr-only">{{ .form.message }}</label>
              <textarea id="contact-message" class="form-control" name="message" rows="5" placeholder="{{ .form.message }}" required></textarea>
            </div>
            <button type="submit" class="btn btn-main">{{ .form.button }}</button>
            <p class="contact-form-warning" data-contact-form-warning hidden>Please complete the CAPTCHA before sending your message.</p>
            <br><br>
            <div data-netlify-recaptcha></div>
          </form>
        </div>
      </div>

      <div class="col-md-6 col-sm-12">
        <div class="block">
          <h2 class="onepage-light-heading">{{ .box.title }}</h2>
          <ul class="address-block onepage-light-text onepage-copy">
            <li>
              <i class="fa fa-map-marker" aria-hidden="true"></i>{{ .box.address }}
            </li>
            <li>
              <i class="fa fa-envelope-o" aria-hidden="true"></i>
              Email: <a href="mailto:{{ .box.email }}">{{ .box.email }}</a>
            </li>
          </ul>
          <ul class="social-icons">
            {{ partial "social.html" . }}
          </ul>
        </div>
      </div>
    </div>
  </div>
</section>
{{ end }}
