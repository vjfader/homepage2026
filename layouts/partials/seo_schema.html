<script type="application/ld+json">
{{ $description := .Site.Params.seo.description }}
{{ with .Description }}
  {{ $description = . }}
{{ else }}
  {{ if and .IsPage .Summary }}
    {{ $description = .Summary | plainify | truncate 160 }}
  {{ end }}
{{ end }}
{{ $isServicePage := or (eq .Params.id "vfx-page") (eq .Params.id "stage-design-page") }}
{{ if .IsHome }}
{{- $s := .Site.Params.social -}}
{{- $awards := slice -}}
{{- range .Site.Params.awards }}{{ $awards = $awards | append (printf "%s, %s (%d)" .name .org .year) }}{{ end -}}
{{- $person := dict
  "@context" "https://schema.org"
  "@type" "Person"
  "name" .Site.Params.author
  "alternateName" (slice "VJ Fader" "Fader" "Wen Cui")
  "url" .Site.BaseURL
  "image" (.Site.Params.seo.image | absURL)
  "jobTitle" "Motion Designer, AI Video and VFX Artist, Stage Designer"
  "description" $description
  "homeLocation" (dict "@type" "Place" "name" .Site.Params.location)
  "alumniOf" (dict "@type" "CollegeOrUniversity" "name" "ArtCenter College of Design")
  "knowsLanguage" (slice "English" "Chinese" "Korean" "German")
  "award" $awards
  "sameAs" (slice $s.linkedin $s.youtube $s.vimeo $s.instagram $s.facebook)
  "knowsAbout" .Site.Params.keywords
-}}
{{ $person | jsonify | safeJS }}
{{ else if $isServicePage }}
{
  "@context": "https://schema.org",
  "@type": "WebPage",
  "name": "{{ .Title }}",
  "url": "{{ .Permalink }}",
  "description": "{{ $description }}",
  "about": {
    "@type": "Person",
    "name": "{{ .Site.Params.author }}",
    "alternateName": "Fader",
    "jobTitle": "Motion Designer, AI Video and VFX Artist, Stage Designer"
  },
  "creator": {
    "@type": "Person",
    "name": "{{ .Site.Params.author }}"
  },
  "primaryImageOfPage": {
    "@type": "ImageObject",
    "url": "{{ .Site.Params.seo.image | absURL }}"
  }
}
{{ else if .IsPage }}
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ .Permalink }}"
  },
  "headline": "{{ .Title }}",
  "description": "{{ $description }}",
  "inLanguage": "en-US",
  "author": {
    "@type": "Person",
    "name": "{{ .Site.Params.author }}"
  },
  "publisher": {
    "@type": "Person",
    "name": "{{ .Site.Params.author }}"
  },
  "datePublished": "{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}",
  "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}",
  "url": "{{ .Permalink }}",
  "wordCount": "{{ .WordCount }}"
}
{{ else }}
{
  "@context": "https://schema.org",
  "@type": "WebPage",
  "name": "{{ .Title }}",
  "url": "{{ .Permalink }}",
  "description": "{{ $description }}"
}
{{ end }}
</script>
